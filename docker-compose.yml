services:
  app:
    build: ./docker
    init: true
    command: ["sh", "docker/dev.sh"]
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_DATABASE: /data/database.sqlite
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - .:/app
      - php-dependencies:/app/vendor
      - js-dependencies:/app/node_modules
      - frontend-build:/app/public/build
      - sqlite-data:/data
      - app-storage:/app/storage
    tmpfs:
      - /app/bootstrap/cache
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8000/alumnos"]
      interval: 5s
      timeout: 3s
      start_period: 60s
      retries: 12

volumes:
  php-dependencies:
  js-dependencies:
  frontend-build:
  sqlite-data:
  app-storage:
